name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        working-directory: backend
        run: dotnet build TeaAuction.slnx -c Release
      - name: Test
        working-directory: backend
        run: dotnet test TeaAuction.slnx -c Release --no-build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tea
          POSTGRES_PASSWORD: tea
          POSTGRES_DB: tea_auction
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tea -d tea_auction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Apply EF migrations
        working-directory: backend
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=tea_auction;Username=tea;Password=tea
        run: |
          dotnet tool restore
          dotnet restore TeaAuction.slnx
          dotnet ef database update --project src/TeaAuction.Infrastructure --startup-project src/TeaAuction.Api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
